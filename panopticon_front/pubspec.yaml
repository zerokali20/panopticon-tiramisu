name: panopticon
description: On-device AI vishing & deepfake audio defense system.
publish_to: none
version: 0.9.2+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  go_router: ^14.2.7
  permission_handler: ^11.3.1
  file_picker: ^8.0.0+1
  ffi: ^2.1.0

  # ── GraphRAG: SQLite Relational Graph Engine ─────────────────────────────
  # Drift (type-safe SQLite ORM with code generation)
  drift: ^2.18.0
  # Native SQLite binaries for Android/iOS/desktop
  sqlite3_flutter_libs: ^0.5.24
  # File system path utilities
  path_provider: ^2.1.4
  path: ^1.9.0

  # ── GraphRAG: ObjectBox Vector Store ─────────────────────────────────────
  # ObjectBox core (includes the HNSW vector index)
  objectbox: ^5.0.0
  # Native ObjectBox binaries for Android/iOS/desktop
  objectbox_flutter_libs: ^5.0.0

  # ── Ingestion utilities ───────────────────────────────────────────────────
  # SHA-256 for deterministic document ID generation
  crypto: ^3.0.3
  # Annotations (@visibleForTesting, etc.)
  meta: ^1.9.0
  dio: ^5.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Drift code generator
  drift_dev: ^2.33.0
  # ObjectBox code generator
  objectbox_generator: ^5.3.2
  # Shared build runner (triggers both generators)
  build_runner: ^2.15.0

# Force source_gen 4.x to be compatible with analyzer 8.x that drift_dev pulls in.
# source_gen 3.1.0 calls DartObjectImpl.getInvocation() which was removed in analyzer 8.4.1.
dependency_overrides:
  source_gen: ^4.0.0

flutter:
  uses-material-design: true
